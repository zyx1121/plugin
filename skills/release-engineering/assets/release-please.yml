# The only release workflow this repo has. Publishing is a merge, not a
# command: conventional commits land on main, release-please keeps one open
# release PR with the next version and the changelog, and merging that PR is
# what tags and publishes. Nothing here is ever run by hand.
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      # RELEASE_PLEASE_TOKEN is a fine-grained PAT or a GitHub App token with
      # `contents: write` + `pull-requests: write`. With the default
      # GITHUB_TOKEN the release PR is opened, but no workflow runs on it, so
      # required checks stay pending forever and the PR cannot be merged.
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

